name: pigpower_mobile
description: >
  PigPower SmartFarm Platform — Flutter mobile application.
  Implements SRS 5.6 Flutter Mobile Application Architecture.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management — 5.6 AD-MOB-001 ---
  flutter_riverpod: ^2.5.1

  # --- Local database (offline-first, OSDS FR-OSDS-002) — 5.6 AD-MOB-002 ---
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Networking — 5.6 AD-MOB-003 ---
  dio: ^5.5.0+1

  # --- Navigation — 5.6 AD-MOB-004 ---
  go_router: ^14.2.3

  # --- Secure token storage — 5.6 AD-MOB-005 ---
  flutter_secure_storage: ^9.2.2

  # --- Connectivity monitoring for the sync engine — OSDS §9 ---
  connectivity_plus: ^6.0.5

  # --- Media capture/compression — 5.6 AD-MOB-007, DFM §55 ---
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # --- Push notification transport only, per 5.6 AD-MOB-006 ---
  firebase_messaging: ^15.1.0
  firebase_core: ^3.4.0

  # --- Localization (English/Sesotho) — 5.6 AD-MOB-008, SACM FR-SACM-022 ---
  flutter_localizations:
    sdk: flutter
  # Pinned to whatever flutter_localizations (bundled with your installed
  # Flutter SDK) actually requires — this drifts as the SDK is upgraded,
  # since flutter_localizations has no independent version of its own and
  # always demands an exact intl range. ^0.19.0 was correct for an older
  # SDK; bumped to satisfy a newer one (error named ^0.20.3 as required).
  intl: ^0.20.3

  uuid: ^4.5.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Drift code generation (required — see README "Required setup step") ---
  drift_dev: ^2.20.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/